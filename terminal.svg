<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200">
  <defs>
    <clipPath id="terminal-clip">
      <rect width="380" height="200" rx="6" ry="6" />
    </clipPath>
    <clipPath id="type-clip">
      <rect id="type-rect" x="28" y="32" width="0" height="16" />
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>
  <style>
    @keyframes type-anim {
      0%, 10% { width: 0; }
      25%, 90% { width: 86px; }
      95%, 100% { width: 0; }
    }
    @keyframes cursor-move {
      0%, 10% { transform: translateX(0); }
      25%, 90% { transform: translateX(86px); }
      95%, 100% { transform: translateX(0); }
    }
    @keyframes cursor1-vis {
      0%, 32% { opacity: 1; }
      32.1%, 100% { opacity: 0; }
    }
    @keyframes cursor2-vis {
      0%, 32% { opacity: 0; }
      32.1%, 90% { opacity: 1; }
      90.1%, 100% { opacity: 0; }
    }
    @keyframes output-vis {
      0%, 32% { opacity: 0; }
      32.1%, 90% { opacity: 1; }
      90.1%, 100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .terminal-text {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #c9d1d9;
    }
    .blink-el {
      animation: blink 0.8s step-end infinite;
    }
    #type-rect {
      animation: type-anim 10s infinite;
    }
    #cursor-group-1 {
      animation: cursor-move 10s infinite, cursor1-vis 10s infinite;
    }
    #cursor-group-2 {
      animation: cursor2-vis 10s infinite;
    }
    #output-group {
      animation: output-vis 10s infinite;
    }
  </style>
  <g clip-path="url(#terminal-clip)">
    <!-- Terminal Background -->
    <rect width="380" height="200" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />
    
    <!-- Terminal Header -->
    <rect width="380" height="26" fill="#161b22" />
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56" />
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e" />
    <circle cx="34" cy="13" r="3.5" fill="#27c93f" />
    <text x="48" y="16.5" fill="#8b949e" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10">alinshan@kali:~</text>
    <line x1="0" y1="26" x2="380" y2="26" stroke="#30363d" stroke-width="1" />

    <!-- Terminal Body -->
    <g class="terminal-text">
      <!-- Line 1: Prompt and typed command -->
      <text x="16" y="44" fill="#58a6ff" font-weight="bold">$</text>
      <text x="28" y="44" fill="#c9d1d9" clip-path="url(#type-clip)">cat about.txt</text>

      <!-- Cursor 1 -->
      <g id="cursor-group-1">
        <rect class="blink-el" x="28" y="42" width="5" height="1.5" fill="#58a6ff" />
      </g>

      <!-- Output (Line 2 to 9) -->
      <g id="output-group">
        <line x1="16" y1="54" x2="364" y2="54" stroke="#21262d" stroke-width="1" />
        
        <text x="16" y="72" fill="#58a6ff">❯</text>
        <text x="28" y="72">Self-taught cybersecurity enthusiast</text>

        <text x="16" y="89" fill="#58a6ff">❯</text>
        <text x="28" y="89">Web application security &amp; OWASP Top 10</text>

        <text x="16" y="106" fill="#58a6ff">❯</text>
        <text x="28" y="106">Vulnerability assessment &amp; penetration testing</text>

        <text x="16" y="123" fill="#58a6ff">❯</text>
        <text x="28" y="123">Bug bounty hunting &amp; responsible disclosure</text>

        <text x="16" y="140" fill="#58a6ff">❯</text>
        <text x="28" y="140">Secure software development &amp; code review</text>

        <text x="16" y="157" fill="#58a6ff">❯</text>
        <text x="28" y="157">CTF player &amp; open-source contributor</text>

        <line x1="16" y1="168" x2="364" y2="168" stroke="#21262d" stroke-width="1" />
        
        <text x="16" y="185" fill="#58a6ff" font-weight="bold">$</text>
      </g>

      <!-- Cursor 2 -->
      <g id="cursor-group-2">
        <rect class="blink-el" x="28" y="183" width="5" height="1.5" fill="#58a6ff" />
      </g>
    </g>
  </g>
</svg>
