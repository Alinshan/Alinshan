<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <clipPath id="terminal-clip">
      <rect width="320" height="200" rx="5" ry="5" />
    </clipPath>
    <clipPath id="type-clip">
      <rect id="type-rect" x="22" y="27" width="0" height="15" />
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>
  <style>
    @keyframes type-anim {
      0%, 10% { width: 0; }
      25%, 90% { width: 78px; }
      95%, 100% { width: 0; }
    }
    @keyframes cursor-move {
      0%, 10% { transform: translateX(0); }
      25%, 90% { transform: translateX(78px); }
      95%, 100% { transform: translateX(0); }
    }
    @keyframes cursor1-vis {
      0%, 32% { opacity: 1; }
      32.1%, 100% { opacity: 0; }
    }
    @keyframes cursor2-vis {
      0%, 32% { opacity: 0; }
      32.1%, 90% { opacity: 1; }
      90.1%, 100% { opacity: 0; }
    }
    @keyframes output-vis {
      0%, 32% { opacity: 0; }
      32.1%, 90% { opacity: 1; }
      90.1%, 100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .terminal-text {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 10px;
      fill: #c9d1d9;
    }
    .blink-el {
      animation: blink 0.8s step-end infinite;
    }
    #type-rect {
      animation: type-anim 10s infinite;
    }
    #cursor-group-1 {
      animation: cursor-move 10s infinite, cursor1-vis 10s infinite;
    }
    #cursor-group-2 {
      animation: cursor2-vis 10s infinite;
    }
    #output-group {
      animation: output-vis 10s infinite;
    }
  </style>
  <g clip-path="url(#terminal-clip)">
    <!-- Terminal Background -->
    <rect width="320" height="200" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />
    
    <!-- Terminal Header -->
    <rect width="320" height="24" fill="#161b22" />
    <circle cx="12" cy="12" r="3" fill="#ff5f56" />
    <circle cx="20" cy="12" r="3" fill="#ffbd2e" />
    <circle cx="28" cy="12" r="3" fill="#27c93f" />
    <text x="40" y="15" fill="#8b949e" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9">alinshan@kali:~</text>
    <line x1="0" y1="24" x2="320" y2="24" stroke="#30363d" stroke-width="1" />

    <!-- Terminal Body -->
    <g class="terminal-text">
      <!-- Line 1: Prompt and typed command -->
      <text x="12" y="38" fill="#58a6ff" font-weight="bold">$</text>
      <text x="22" y="38" fill="#c9d1d9" clip-path="url(#type-clip)">cat about.txt</text>

      <!-- Cursor 1 -->
      <g id="cursor-group-1">
        <rect class="blink-el" x="22" y="36" width="5" height="1.5" fill="#58a6ff" />
      </g>

      <!-- Output (Line 2 to 10) -->
      <g id="output-group">
        <line x1="12" y1="46" x2="308" y2="46" stroke="#21262d" stroke-width="1" />
        
        <text x="12" y="62" fill="#58a6ff">❯</text>
        <text x="22" y="62">Self-taught Security Enthusiast</text>

        <text x="12" y="78" fill="#58a6ff">❯</text>
        <text x="22" y="78">Web App Security &amp; OWASP Top 10</text>

        <text x="12" y="94" fill="#58a6ff">❯</text>
        <text x="22" y="94">Vulnerability Assessment &amp; Pentesting</text>

        <text x="12" y="110" fill="#58a6ff">❯</text>
        <text x="22" y="110">Bug Bounty &amp; Responsible Disclosure</text>

        <text x="12" y="126" fill="#58a6ff">❯</text>
        <text x="22" y="126">Secure Dev &amp; Code Review</text>

        <text x="12" y="142" fill="#58a6ff">❯</text>
        <text x="22" y="142">CTF Player</text>

        <text x="12" y="158" fill="#58a6ff">❯</text>
        <text x="22" y="158">Full Stack Developer</text>

        <line x1="12" y1="168" x2="308" y2="168" stroke="#21262d" stroke-width="1" />
        
        <text x="12" y="185" fill="#58a6ff" font-weight="bold">$</text>
      </g>

      <!-- Cursor 2 -->
      <g id="cursor-group-2">
        <rect class="blink-el" x="22" y="183" width="5" height="1.5" fill="#58a6ff" />
      </g>
    </g>
  </g>
</svg>
